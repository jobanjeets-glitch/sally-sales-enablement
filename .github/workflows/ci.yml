name: CI

on:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Syntax check
        run: |
          node --check agent/sally-tools.js
          node --check agent/sally-agent.js
          node --check agent/test-agent.js
          node --check slack-bot/server.js
